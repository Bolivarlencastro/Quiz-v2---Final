<div class="selection-modal-backdrop animate-fade-in" (click)="close.emit()">
  <div class="selection-modal-panel animate-scale-up" (click)="$event.stopPropagation()">
    <div class="selection-modal-header">
      <div>
        <h2 class="selection-modal-title">Selecione o tipo de quiz</h2>
        <p class="selection-modal-subtitle">Use o mesmo padrao visual do Konquest, mantendo o fluxo atual do prototipo.</p>
      </div>
      <button (click)="close.emit()" class="selection-modal-close kp-icon-btn">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="selection-grid">
      <div (click)="typeSelected.emit('evaluative')" class="selection-card">
        <span class="material-symbols-outlined selection-card-icon">quiz</span>
        <h3 class="selection-card-title">Avaliativo</h3>
        <p class="selection-card-text">Para validar conhecimento com resposta correta.</p>
      </div>

      <div 
        id="quiz-survey-type"
        class="selection-card selection-card-disabled"
        [class.highlight-feature]="isHighlighting()">
        <span class="selection-card-pill">Em breve</span>
        <span class="material-symbols-outlined selection-card-icon">poll</span>
        <h3 class="selection-card-title">Pesquisa</h3>
        <p class="selection-card-text">Para coletar opinioes sem resposta correta.</p>
      </div>
    </div>

     <div class="selection-modal-footer">
        <button (click)="close.emit()" class="selection-button selection-button-secondary kp-btn kp-btn-secondary">
            Voltar
        </button>
    </div>
  </div>
</div>
