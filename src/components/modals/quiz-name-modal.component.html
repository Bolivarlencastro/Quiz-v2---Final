<div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 animate-fade-in" (click)="close.emit()">
  <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-md p-8 m-4 animate-scale-up" (click)="$event.stopPropagation()">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-200">
        Novo Quiz ({{ quizType() === 'survey' ? 'Pesquisa' : 'Avaliativo' }})
      </h2>
      <button (click)="close.emit()" class="kp-icon-btn">
        <span class="material-symbols-outlined text-3xl">close</span>
      </button>
    </div>
    
    <div>
        <label for="quizName" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nome do Quiz *</label>
        <input type="text" id="quizName" [(ngModel)]="quizName" placeholder="Ex: Quiz de Boas Vindas" class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-purple-500 focus:border-purple-500 dark:text-gray-200">
    </div>

    <div class="mt-8 flex justify-end gap-4">
        <button (click)="back.emit()" class="kp-btn kp-btn-secondary">
            Voltar
        </button>
        <button (click)="save()" [disabled]="!quizName().trim()" class="kp-btn kp-btn-primary">
            Salvar
        </button>
    </div>

  </div>
</div>
