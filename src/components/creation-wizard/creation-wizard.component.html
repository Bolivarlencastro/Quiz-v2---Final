<div class="creation-shell">
  <aside class="creation-sidebar">
    <div class="creation-sidebar-header">
      <h1 class="creation-sidebar-title">{{ title() }}</h1>
      <p class="creation-sidebar-subtitle">Etapas de criacao</p>
    </div>

    <nav class="creation-nav">
      @for (step of steps(); track step.number) {
        <button
          (click)="goToStep(step.number)"
          class="creation-nav-item"
          [class.is-active]="currentStep() === step.number"
        >
          <div class="creation-nav-index">
            <span>{{ step.number }}</span>
          </div>
          <div class="creation-nav-copy">
            <span class="creation-nav-title">{{ step.name }}</span>
            <p class="creation-nav-description">{{ step.description }}</p>
          </div>
        </button>
      }
    </nav>
  </aside>

  <div class="creation-main">
    <main class="creation-content">
      <ng-content></ng-content>
    </main>

    <footer class="creation-footer">
      <button (click)="handleExitRequest()" class="kp-button kp-button-secondary">
        Sair da criacao
      </button>

      <div class="creation-footer-actions">
        @if (currentStep() > 1) {
          <button (click)="prevStep()" class="kp-button kp-button-secondary">Anterior</button>
        }
        @if(currentStep() < steps().length) {
          <button (click)="next()" class="kp-button kp-button-primary">Salvar e avancar</button>
        } @else {
           <button (click)="handlePublish()" class="kp-button kp-button-primary">Publicar</button>
        }
      </div>
    </footer>
  </div>
</div>

<!-- Exit Confirmation Modal -->
@if(showConfirmExitModal()) {
  <div class="dialog-backdrop animate-fade-in">
    <div class="dialog-panel dialog-panel-sm animate-scale-up" (click)="$event.stopPropagation()">
      <div class="dialog-copy">
        <div class="dialog-icon dialog-icon-warning">
          <span class="material-symbols-outlined">warning</span>
        </div>
        <h3 class="dialog-title">Sair sem salvar?</h3>
        <p class="dialog-text">
          Você tem alterações não salvas. Se sair agora, todo o seu progresso será perdido.
        </p>
      </div>

      <div class="dialog-actions">
        <button (click)="cancelExit()" class="kp-button kp-button-secondary">Cancelar</button>
        <button (click)="confirmExit()" class="kp-button kp-button-danger">Sair mesmo assim</button>
      </div>
    </div>
  </div>
}
